[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-aircraft-loading"
version = "0.1.0"
description = "Quantum-assisted decision support for synthetic aircraft loading scenarios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "ortools>=9.10,<10",
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "qiskit>=2.1,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-optimization>=0.7,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "quantum: runs the local Qiskit QAOA simulator",
]
